services:
  expo:
    build: .
    container_name: expo
    working_dir: /usr/src/expo_app

    ports:
      - "8081-8090:8081-8090"

    volumes:
      - ./expo_app:/usr/src/expo_app

    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - EXPO_USE_DEV_SERVER=true

      # Fix essenziale per Windows
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100

    stdin_open: true
    tty: true
